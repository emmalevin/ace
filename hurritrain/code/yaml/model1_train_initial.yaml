experiment_dir: /scratch/gpfs/GVECCHI/el2358/ace/hurritrain/training_output/model1_wandb
save_checkpoint: true
save_restart_every_n_epochs: 999
validate_using_ema: true
max_epochs: 1
n_forward_steps: 2
seed: 42
inference: null
validation_aggregator:
  log_snapshots: false
  log_mean_maps: false
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace
  entity: your_wandb_entity
train_loader:
  batch_size: 2
  num_data_workers: 4
  prefetch_factor: 4
  dataset:
    data_path: /scratch/gpfs/GVECCHI/el2358/ace/training_data
    infer_timestep: false
    subset:
    - 218
    - 413
    - 522
    - 614
    - 649
    - 887
    - 892
    - 1036
    - 1106
    - 1161
validation_loader:
  batch_size: 2
  num_data_workers: 4
  prefetch_factor: 4
  dataset:
    data_path: /scratch/gpfs/GVECCHI/el2358/ace/training_data
    infer_timestep: false
    subset:
    - 0
    - 730
optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper:
  loss:
    type: MSE
  step:
    type: single_module
    config:
      builder:
        type: SphericalFourierNeuralOperatorNet
        config:
          embed_dim: 384
          filter_type: linear
          hard_thresholding_fraction: 1.0
          use_mlp: true
          normalization_layer: instance_norm
          num_layers: 8
          operator_type: dhconv
          scale_factor: 1
          separable: false
      normalization:
        network:
          global_means_path: /scratch/gpfs/GVECCHI/el2358/ACE2/training_validation_data/normalization/centering.nc
          global_stds_path: /scratch/gpfs/GVECCHI/el2358/ACE2/training_validation_data/normalization/scaling-full-field.nc
        loss:
          global_means_path: /scratch/gpfs/GVECCHI/el2358/ACE2/training_validation_data/normalization/centering.nc
          global_stds_path: /scratch/gpfs/GVECCHI/el2358/ACE2/training_validation_data/normalization/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
